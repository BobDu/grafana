# fork(team-sync): build the team-sync Grafana image and push to GHCR.
#
# Triggered by tags matching team-sync-v* (e.g. team-sync-v13.0.2-1).
# Uses the official root Dockerfile unchanged; GHA layer cache makes
# rebuilds cheap since this fork never touches the frontend.
name: team-sync-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'team-sync-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bobdu/grafana
          tags: |
            type=ref,event=tag
            type=raw,value=team-sync-latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
