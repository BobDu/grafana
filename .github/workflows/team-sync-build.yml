# fork(team-sync): build the team-sync Grafana image and push to GHCR.
#
# Triggered by tags matching team-sync-v* (e.g. team-sync-v13.0.2-1).
# Uses the official root Dockerfile unchanged. Deliberately avoids
# third-party actions (only github-owned actions/checkout) so it runs
# under any repository Actions policy; layer cache lives in the registry
# (ghcr buildcache tag) — rebuilds are cheap since this fork never
# touches the frontend.
name: team-sync-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'team-sync-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx create --use --name teamsync-builder
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=ghcr.io/bobdu/grafana:buildcache \
            --cache-to type=registry,ref=ghcr.io/bobdu/grafana:buildcache,mode=max \
            -t "ghcr.io/bobdu/grafana:${GITHUB_REF_NAME}" \
            -t ghcr.io/bobdu/grafana:team-sync-latest \
            --push .
